<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Investor Hub - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #0d0d0d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen px-4">

  <div class="w-full max-w-md bg-[#141414] border border-[#222] rounded-2xl p-8 shadow-2xl">
    
    <!-- Logo + Title -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center">
        <span class="text-black text-2xl font-bold"></span>
      </div>
      <h1 class="text-white text-2xl font-semibold mt-4 tracking-tight">Apple Investor Hub</h1>
      <p class="text-[#888] text-sm mt-1">Institutional Growth & Asset Management</p>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="hidden mb-4 p-4 text-sm rounded-xl border bg-red-950/30 border-red-900 text-red-400"></div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-xs font-medium uppercase tracking-wider text-[#aaa] mb-2">Secure Email Address</label>
        <input type="email" id="email" required placeholder="name@example.com"
          class="w-full bg-[#1c1c1c] border border-[#333] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-white transition-all text-sm">
      </div>

      <div>
        <label class="block text-xs font-medium uppercase tracking-wider text-[#aaa] mb-2">Access PIN / Password</label>
        <input type="password" id="password" required placeholder="••••••••"
          class="w-full bg-[#1c1c1c] border border-[#333] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-white transition-all text-sm">
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-white hover:bg-gray-200 active:scale-[0.99] text-black font-medium py-3.5 rounded-xl transition-all text-sm mt-2">
        Verify Credentials
      </button>
    </form>
  </div>

  <div class="text-center mt-6">
    <p class="text-xs text-neutral-500">
      First-time deployment? 
      <a href="signup.html" class="text-white hover:underline font-medium">Create portal account</a>
    </p>
  </div>

  <script>
    // ============ YOUR SUPABASE ============
    const SUPABASE_URL = 'https://kbwhazbyqyvepyaelspo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_od1eSv92ALG7u54kg6SR4g_87YdFT-n';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ============ LOGIN ============
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');

      alertBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerText = "Authenticating secure terminal...";

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) throw error;

        // Save basic session info
        localStorage.setItem("userId", data.user.id);
        localStorage.setItem("userEmail", data.user.email);

        // Go to dashboard
        window.location.href = "dashboard.html";

      } catch (err) {
        alertBox.innerText = err.message || "Invalid credentials or network error.";
        alertBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerText = "Verify Credentials";
      }
    });
  </script>
</body>
</html>
